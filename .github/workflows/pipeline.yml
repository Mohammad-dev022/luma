name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  docker-build:
    name: Docker Build & Verify
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t luma-store:${{ github.sha }} .
      - run: |
          docker run -d -p 3000:3000 --name luma-test luma-store:${{ github.sha }}
          sleep 8
          curl -f http://localhost:3000 || (docker logs luma-test && exit 1)
          curl -f http://localhost:3000/api/products
          curl -f http://localhost:3000/api/cart
          docker stop luma-test

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service luma
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Verify deployment is live
        run: |
          sleep 15
          curl -f https://luma-production-cb8f.up.railway.app || exit 1
          echo "Deployment verified — app is live"
