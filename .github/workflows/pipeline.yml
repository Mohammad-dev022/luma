name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  docker-build:
    name: Docker Build & Verify
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t luma-store:${{ github.sha }} .
      - run: |
          docker run -d -p 3000:3000 --name luma-test luma-store:${{ github.sha }}
          sleep 8
          curl -f http://localhost:3000 || (docker logs luma-test && exit 1)
          curl -f http://localhost:3000/api/products
          curl -f http://localhost:3000/api/cart
          docker stop luma-test

  deploy:
    name: Deploy to Heroku
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          usedocker: true
      - run: |
          sleep 15
          curl -f https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com || exit 1
